name: Linting and Format Checks
on:
  workflow_dispatch:

  pull_request:
    branches: ["**"]

  push:
    branches: ["main"]

env:
  CHAT_ENV: testing
  LOGGING_LEVEL: DEBUG
  OPENAI_API_KEY: sk-fake  # pragma: allowlist secret

jobs:
  backend-lint-and-format-checks:
    runs-on: ubuntu-latest

    defaults:
      # All run steps execute from backend directory.
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install uv and point it at backend directory so it finds the right pyproject.toml.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: latest
          working-directory: backend

      # Install the pinned tool versions.
      - name: Sync dev dependencies
        run: uv sync --locked --extra dev

      # Run linters and formatters.
      - name: isort
        run: uv run --locked --no-sync isort --check --diff src/ tests/

      - name: black
        run: uv run --locked --no-sync black --check src/ tests/

      - name: ruff
        run: |
          uv run --locked --no-sync ruff check src/
          uv run --locked --no-sync ruff check tests/

      - name: interrogate
        run: uv run --locked --no-sync interrogate -v src/ tests/

      - name: mypy
        run: |
          uv run --locked --no-sync mypy src/ --explicit-package-bases --ignore-missing-imports --show-error-codes
          uv run --locked --no-sync mypy tests/ --explicit-package-bases --ignore-missing-imports --show-error-codes

      - name: pylint
        run: |
          uv run --locked --no-sync pylint src/
          uv run --locked --no-sync pylint tests/
