name: Tests
on:
  workflow_dispatch:

  pull_request:
    branches: [ "**" ]

  push:
    branches: ["main"]

env:
  CHAT_ENV: testing
  LOGGING_LEVEL: DEBUG
  OPENAI_API_KEY: sk-fake  # pragma: allowlist secret

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      # All run steps execute from backend directory.
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install uv and point it at backend directory so it finds the right pyproject.toml.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: latest
          working-directory: backend

      # Install the pinned tool versions.
      - name: Sync dev dependencies
        run: uv sync --locked --extra dev

      # Match the local offline suite; missing tests must fail the job.
      - name: Run Pytest with coverage
        run: >-
          uv run --locked --no-sync pytest -rsPQ -m "not costs-money"
          --cov-report term-missing --cov-config=./pyproject.toml --cov=. tests
