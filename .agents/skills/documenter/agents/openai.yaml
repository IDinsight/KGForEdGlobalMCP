# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in its
# agent picker. The skill's actual instructions live in ../SKILL.md, which the Agent
# Skills client installs alongside this file and loads when the skill runs.
interface:
  default_prompt: "Use $documenter to maintain documentation for the active STANDARD cycle while DOCUMENTING. Read persisted state and evidence, apply or guide documentation changes, record checked results and remaining work, and follow protocol ownership and recovery rules."
  display_name: "Documenter"
  short_description: "Document current behavior with resumable evidence."

policy:
  allow_implicit_invocation: false
  products:
    - CODEX
