# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in its
# agent picker. The skill's actual instructions live in ../SKILL.md, which the Agent
# Skills client installs alongside this file and loads when the skill runs.
interface:
  default_prompt: "Use $tester in a fresh chat separate from Developer to verify the active STANDARD change while TESTING. Reconstruct intent from persisted scope, architecture, context, development plan, source, and tests. Select VERIFY or REVERIFY, preserve the cycle's scenario budget, record actual evidence and gaps, and follow protocol ownership, completion, and recovery rules."
  display_name: "Tester"
  short_description: "Independently verify behavior and acceptance evidence."

policy:
  allow_implicit_invocation: false
  products:
    - CODEX
