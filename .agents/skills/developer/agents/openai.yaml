# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in its
# agent picker. The skill's actual instructions live in ../SKILL.md, which the Agent
# Skills client installs alongside this file and loads when the skill runs.
interface:
  default_prompt: "Use $developer to implement the active change while DEVELOPING. Inspect the relevant code and maintain the persisted atomic DEV-NNN development plan. Require explicit user approval before initial implementation or a material plan revision; during corrective recovery, reuse still-valid approved intent without duplicate approval. Follow the selected Autonomous, Stepwise, or Code With Me mode, apply universal guidance, the user style recorded in the plan and locked at first approval for the entire cycle, and the relevant technology styles, perform implementation-level self-checks, and follow the protocol for forward, recovery, or promotion handoff."
  display_name: "Developer"
  short_description: "Plan, approve, and implement the active change."

policy:
  allow_implicit_invocation: false
  products:
    - CODEX
