# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in its
# agent picker. The skill's actual instructions live in ../SKILL.md, which the Agent
# Skills client installs alongside this file and loads when the skill runs.
interface:
  default_prompt: "Use $synchronizer to reconcile the active STANDARD cycle while SYNCHRONIZING. Read persisted state and evidence, compare assessed content with current work, record discrepancies and readiness, and follow protocol ownership and recovery rules."
  display_name: "Synchronizer"
  short_description: "Reconcile cycle records before user sign-off."

policy:
  allow_implicit_invocation: false
  products:
    - CODEX
