# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in its
# agent picker. The skill's actual instructions live in ../SKILL.md, which the Agent
# Skills client installs alongside this file and loads when the skill runs.
interface:
  default_prompt: "Use $navigator to explain this project from repository evidence, investigate a question, or quiz my understanding, without changing files or workflow state."
  display_name: "Navigator"
  short_description: "Explain, investigate, and check project understanding."

policy:
  allow_implicit_invocation: false
  products:
    - CODEX
